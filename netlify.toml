[build]
  base = "vite-frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  # TODO: Replace this URL with your production backend URL once deployed
  to = "https://your-production-backend.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
